<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Edith: control your PC from Telegram with your voice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.55" stop-color="#0c1630"/>
      <stop offset="1" stop-color="#1a0f2e"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)" opacity="0.45"/>

  <!-- arc reactor style core -->
  <g transform="translate(1030 200)">
    <circle r="150" fill="url(#glow)"/>
    <circle r="118" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2"/>
    <circle r="96" fill="none" stroke="#60a5fa" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="6 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle r="72" fill="none" stroke="#c084fc" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="40 18">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle r="44" fill="#0b1220" stroke="#5eead4" stroke-width="3"/>
    <!-- voice waveform inside the core -->
    <g stroke="#5eead4" stroke-width="5" stroke-linecap="round">
      <line x1="-24" y1="-6" x2="-24" y2="6"><animate attributeName="y1" values="-6;-16;-6" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y2" values="6;16;6" dur="1.1s" repeatCount="indefinite"/></line>
      <line x1="-12" y1="-14" x2="-12" y2="14"><animate attributeName="y1" values="-14;-6;-14" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y2" values="14;6;14" dur="0.9s" repeatCount="indefinite"/></line>
      <line x1="0" y1="-20" x2="0" y2="20"><animate attributeName="y1" values="-20;-9;-20" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y2" values="20;9;20" dur="1.3s" repeatCount="indefinite"/></line>
      <line x1="12" y1="-10" x2="12" y2="10"><animate attributeName="y1" values="-10;-18;-10" dur="1s" repeatCount="indefinite"/><animate attributeName="y2" values="10;18;10" dur="1s" repeatCount="indefinite"/></line>
      <line x1="24" y1="-5" x2="24" y2="5"><animate attributeName="y1" values="-5;-12;-5" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y2" values="5;12;5" dur="1.2s" repeatCount="indefinite"/></line>
    </g>
  </g>

  <!-- phone -> PC link -->
  <g stroke="#334155" stroke-width="2" fill="none" stroke-dasharray="4 8">
    <path d="M760 300 C 820 300, 860 250, 900 230">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="96" y="208" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="150" font-weight="800" letter-spacing="18" fill="url(#word)">EDITH</text>
  <text x="102" y="262" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="500" fill="#cbd5e1">Your Windows PC, one Telegram message away.</text>
  <text x="102" y="306" font-family="Consolas, Menlo, monospace" font-size="20" fill="#64748b">voice  ·  50 actions  ·  automations  ·  owner-only  ·  confirm-before-danger</text>
</svg>
